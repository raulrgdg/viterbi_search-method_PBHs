# Conda environment used for the paper results (Linux, Python 3.10).
#   conda env create -f environment.yml
#   conda activate pbh-viterbi
#   pip install -e .
name: pbh-viterbi
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.3.3
      - matplotlib==3.10.8
      - astropy==6.1.7
      - h5py==3.15.1
      - lalsuite==7.26.1
      - pycbc==2.9.0
      - gwpy==3.0.13
      - soapcw==0.2.4
      - pytest
